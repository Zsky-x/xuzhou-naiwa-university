<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>徐州奶蛙大学 · Xuzhou Naiwa University</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #1a3a2a;
    --ink-deep: #0f2a1d;
    --cream: #fdf6e9;
    --cream-warm: #f5ead3;
    --leaf: #7cb342;
    --leaf-light: #aed581;
    --cinnabar: #b33a2a;
    --gold: #c9a961;
  }

  html, body {
    height: 100%;
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
  }

  a { text-decoration: none; color: inherit; }

  /* ===== 整页可点击容器 ===== */
  .portal {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.3s ease;
    overflow: hidden;
  }
  .portal:hover { transform: scale(1.01); }
  .portal:active { transform: scale(0.995); }

  /* ===== 背景装饰：水波纹 ===== */
  .bg-waves {
    position: absolute;
    bottom: -40px;
    left: 0;
    width: 100%;
    height: 200px;
    opacity: 0.15;
    z-index: 0;
  }
  .bg-waves svg { width: 100%; height: 100%; }

  /* ===== 背景装饰：远山/校园剪影 ===== */
  .bg-hills {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 180px;
    opacity: 0.08;
    z-index: 0;
  }

  /* ===== 顶部英文校名 ===== */
  .top-english {
    position: absolute;
    top: 36px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    letter-spacing: 0.45em;
    color: var(--ink);
    opacity: 0.7;
    z-index: 2;
    text-transform: uppercase;
    padding-left: 0.45em; /* 抵消 letter-spacing */
  }

  /* ===== 顶部红线 ===== */
  .top-rule {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 2px;
    background: var(--cinnabar);
    z-index: 2;
  }

  /* ===== 封面主图 ===== */
  .cover-wrap {
    position: relative;
    z-index: 2;
    margin-bottom: 22px;
  }
  .cover-wrap img {
    width: clamp(260px, 40vmin, 440px);
    height: auto;
    display: block;
    border-radius: 14px;
    box-shadow:
      0 20px 40px rgba(26, 58, 42, 0.22),
      0 4px 10px rgba(26, 58, 42, 0.1);
    border: 4px solid #fff;
    outline: 1px solid rgba(26, 58, 42, 0.08);
  }

  /* ===== 中文大标题 ===== */
  .main-title {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: clamp(38px, 7vmin, 72px);
    letter-spacing: 0.12em;
    color: var(--ink-deep);
    z-index: 2;
    margin-bottom: 12px;
    padding-left: 0.12em;
    text-shadow: 0 2px 0 rgba(201, 169, 97, 0.15);
  }

  /* ===== 校训 ===== */
  .motto {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(14px, 2vmin, 18px);
    letter-spacing: 0.5em;
    color: var(--leaf);
    z-index: 2;
    margin-bottom: 8px;
    padding-left: 0.5em;
    font-weight: 600;
  }

  /* ===== 校徽式印章 ===== */
  .seal {
    position: absolute;
    right: 8%;
    top: 50%;
    transform: translateY(-50%) rotate(-8deg);
    width: 80px;
    height: 80px;
    border: 2.5px solid var(--cinnabar);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cinnabar);
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 13px;
    line-height: 1.2;
    text-align: center;
    opacity: 0.75;
    z-index: 2;
    letter-spacing: 0.05em;
  }
  .seal span { display: block; }

  /* ===== 底部提示 ===== */
  .enter-hint {
    position: absolute;
    bottom: 40px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 2;
  }
  .enter-hint .arrow {
    display: inline-block;
    font-size: 20px;
    color: var(--cinnabar);
    margin-bottom: 8px;
    animation: bounce 1.8s ease-in-out infinite;
  }
  .enter-hint .text {
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--ink);
    opacity: 0.6;
    padding-left: 0.3em;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }

  /* ===== 左下角年份 ===== */
  .year {
    position: absolute;
    bottom: 20px;
    left: 24px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--ink);
    opacity: 0.35;
    z-index: 2;
  }

  /* ===== 右下角网址 ===== */
  .url-label {
    position: absolute;
    bottom: 20px;
    right: 24px;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--ink);
    opacity: 0.35;
    z-index: 2;
    font-family: 'Noto Sans SC', monospace;
  }

  /* ===== 装饰小圆点（荷叶） ===== */
  .lily {
    position: absolute;
    border-radius: 50%;
    background: var(--leaf-light);
    opacity: 0.25;
    z-index: 1;
  }
  .lily-1 { width: 60px; height: 60px; top: 18%; left: 12%; }
  .lily-2 { width: 30px; height: 30px; top: 28%; left: 20%; }
  .lily-3 { width: 45px; height: 45px; bottom: 25%; right: 15%; }
  .lily-4 { width: 20px; height: 20px; bottom: 35%; right: 22%; }

  /* ===== 移动端适配 ===== */
  @media (max-width: 600px) {
    .seal {
      position: relative;
      right: auto;
      top: auto;
      transform: rotate(-8deg);
      margin-top: 16px;
      width: 64px;
      height: 64px;
      font-size: 11px;
    }
    .top-english { top: 24px; font-size: 11px; }
    .top-rule { top: 52px; }
    .main-title { letter-spacing: 0.08em; }
    .enter-hint { bottom: 28px; }
    .year, .url-label { font-size: 10px; }
  }

  /* ===== 减少动效偏好 ===== */
  @media (prefers-reduced-motion: reduce) {
    .enter-hint .arrow {
      animation: none;
    }
  }
</style>
</head>
<body>

<a class="portal" href="https://www.xzit.edu.cn/" target="_blank" rel="noopener" aria-label="进入徐州工程学院官网">

  <!-- 背景装饰 -->
  <div class="lily lily-1"></div>
  <div class="lily lily-2"></div>
  <div class="lily lily-3"></div>
  <div class="lily lily-4"></div>

  <!-- 水波纹 SVG -->
  <div class="bg-waves" aria-hidden="true">
    <svg viewBox="0 0 1440 200" preserveAspectRatio="none">
      <path d="M0,100 C240,150 480,50 720,100 C960,150 1200,50 1440,100 L1440,200 L0,200 Z" fill="#7cb342"/>
      <path d="M0,140 C240,180 480,90 720,140 C960,180 1200,90 1440,140 L1440,200 L0,200 Z" fill="#1a3a2a"/>
    </svg>
  </div>

  <!-- 顶部英文 -->
  <div class="top-english">Xuzhou Naiwa University</div>
  <div class="top-rule"></div>

  <!-- 封面主图 -->
  <div class="cover-wrap">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Il8KbqTWPolL1dxKM5JcbHgXnHd" alt="徐州奶蛙大学 · 林间列车">
  </div>

  <!-- 中文校名 -->
  <h1 class="main-title">徐州奶蛙大学</h1>

  <!-- 校训 -->
  <div class="motto">厚德 博学 笃行 奶蛙</div>

  <!-- 印章 -->
  <div class="seal" aria-hidden="true">
    <span>奶蛙</span>
    <span>之印</span>
  </div>

  <!-- 底部提示 -->
  <div class="enter-hint">
    <div class="arrow">↓</div>
    <div class="text">点击任意处进入官网</div>
  </div>

  <!-- 角落小字 -->
  <div class="year">EST. 2026</div>
  <div class="url-label">www.xzit.edu.cn</div>

</a>

</body>
</html>
